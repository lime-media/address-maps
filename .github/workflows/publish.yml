name: Publish address maps

# Fires when someone adds or replaces a spreadsheet in inbox/. Also runnable by
# hand from the Actions tab, which is the way to re-run after fixing something.
on:
  push:
    branches: [main]
    paths:
      - 'inbox/**'
      - 'pipeline/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. A second upload while the first is running waits its
# turn instead of racing it -- but don't cancel the first, because a half-done
# deploy is worse than a queued one.
concurrency:
  group: publish-address-maps
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Say plainly what is missing, before anything can fail obscurely on it.
      - name: Check the repo has what it needs
        run: |
          missing=0
          for f in requirements.txt pipeline/publish.py pipeline/validate.py; do
            [ -f "$f" ] || { echo "MISSING: $f"; missing=1; }
          done
          # `ls a.xlsx b.csv` exits non-zero if EITHER is absent, so testing
          # several extensions with one ls reports "missing" whenever any one of
          # them is missing. find, then check we got at least one hit.
          found=$(find inbox -maxdepth 1 -type f \
            \( -iname '*.xlsx' -o -iname '*.xlsm' -o -iname '*.xls' -o -iname '*.csv' \) \
            -not -name '~$*' 2>/dev/null | wc -l)
          if [ "$found" -eq 0 ]; then
            echo "MISSING: no spreadsheet in inbox/"
            missing=1
          else
            echo "Found $found spreadsheet(s) in inbox/."
          fi
          if [ "$missing" = "1" ]; then
            echo ""
            echo "The repo is incomplete. What is actually here:"
            ls -la
            echo ""
            echo "Upload the pipeline folder, the inbox folder, and"
            echo "requirements.txt via Code -> Add file -> Upload files."
            echo "Re-running this workflow will not add them."
            exit 1
          fi
          echo "All present."

      - run: pip install -r requirements.txt

      # Geocoder checkpoints survive between runs, so a large market that timed
      # out resumes instead of starting from zero. Keyed on the inbox contents.
      - uses: actions/cache@v4
        with:
          path: work
          key: geocode-${{ hashFiles('inbox/**') }}
          restore-keys: geocode-

      - name: Build every market
        env:
          # Only used when a tab's column layout isn't recognized. Absent, such a
          # tab is reported and skipped rather than failing the run.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 pipeline/publish.py

      # The gate. Non-zero exit here means nothing is deployed and the currently
      # live maps stay exactly as they are.
      - name: Check before publishing
        id: check
        run: |
          # project-pages URL: https://<owner>.github.io/<repo>/
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          python3 pipeline/validate.py work/ --report report.md --base-url "$BASE" \
            --status-json site/status.json

      # Runs even on failure, so the person who uploaded sees why in plain English
      # on the run page rather than having to read a log.
      - name: Write the summary
        if: always()
        run: cat report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # If a layout was learned this run, surface it. schemas.json needs
      # committing so the next run doesn't pay to learn the same thing again.
      - name: Note any newly learned layout
        if: always()
        run: |
          if ! git diff --quiet -- pipeline/schemas.json; then
            {
              echo ""
              echo "### A new column layout was learned"
              echo ""
              echo "\`pipeline/schemas.json\` changed during this run. Commit it so"
              echo "the layout is recognized directly next time:"
              echo ""
              echo '```diff'
              git diff -- pipeline/schemas.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Crawling is allowed so the noindex meta tag in each map can be read --
      # that is what actually keeps them out of results. status.json cannot carry
      # a meta tag, so it is disallowed outright.
      - name: Write robots.txt
        run: |
          cat > site/robots.txt <<'EOF'
          User-agent: *
          Disallow: /status.json
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
